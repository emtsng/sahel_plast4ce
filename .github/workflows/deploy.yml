name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Load demo content
        run: |
          python manage.py shell -c "from apps.plast4ce.demo_content import *; print('Demo content loaded')"

      - name: Build static site
        run: |
          # django-bakery provides the 'build' management command
          python manage.py build
          # fallback for older setups that used a different command name
          python manage.py build_static || true

      - name: Copy media files
        run: |
          python manage.py copy_media_to_build

      - name: Copy static files
        run: |
          python manage.py collectstatic --noinput --clear

      - name: Copy static to build
        run: |
          cp -r static build/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
