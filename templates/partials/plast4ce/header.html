{% load static %}
<div class="header-top">
    <div class="container-fluid">
        <div class="row">
           
            <div class="col-xl-6 col-lg-6 col-md-12 col-xs-12 text-end">
                
            </div>
        </div>
    </div>
</div>

<div class="header-area">
    <div class="sticky-area">
        <div class="navigation">
            <div class="container-fluid">
                <div class="header-inner-box">
                    <div class="logo logo_navbar">
                        <a class="navbar-brand" href="{% url 'plast4ce:plast4ce_home' %}">
                            <img src="{% static 'plast4ce/img/logo.png' %}" alt="{{ site_name }}">
                        </a>
                    </div>
                    <div class="main-menu">
                        <nav class="navbar navbar-expand-lg">
                            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                                aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                                <span class="navbar-toggler-icon"></span>
                                <span class="navbar-toggler-icon"></span>
                            </button>
                            <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                                <ul class="navbar-nav m-auto">
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'home' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_home' %}">Home</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link nav-link--has-submenu {% if nav_section == 'about' or nav_section == 'team' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_about' %}" aria-haspopup="true">About <i class="las la-angle-down nav-dropdown-caret" aria-hidden="true"></i></a>
                                        <ul class="sub-menu">
                                            <li><a href="{% url 'plast4ce:plast4ce_about' %}">Who we are</a></li>
                                            <li><a href="{% url 'plast4ce:plast4ce_team' %}">Team</a></li>
                                        </ul>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'services' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_services' %}">Services</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'projects' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_projects' %}">Projects</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'gallery' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_gallery' %}">Gallery</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link nav-link--has-submenu {% if nav_section == 'contact' or nav_section == 'faq' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_contact' %}" aria-haspopup="true">Contact <i class="las la-angle-down nav-dropdown-caret" aria-hidden="true"></i></a>
                                        <ul class="sub-menu">
                                            <li><a href="{% url 'plast4ce:plast4ce_contact' %}">Get in touch</a></li>
                                            <li><a href="{% url 'plast4ce:plast4ce_faq' %}">FAQ</a></li>
                                        </ul>
                                    </li>
                                </ul>
                            </div>
                        </nav>
                    </div>
                    <div class="header-btn">
                        <a href="{% url 'plast4ce:plast4ce_contact' %}" class="main-btn primary">Get a quote</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
