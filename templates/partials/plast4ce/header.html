{% load static %}
<div class="header-top">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-6 col-lg-6 col-md-12 col-xs-12">
                <div class="contact-info">
                    <i class="las la-map-marker"></i> Sahel Plast4ce — recycling &amp; sustainability
                    <i class="las la-envelope"></i> hello@sahelplast4ce.example
                    <i class="las la-phone"></i> +1 (800) 555-0142
                </div>
            </div>
            <div class="col-xl-6 col-lg-6 col-md-12 col-xs-12 text-end">
                <div class="header_top_right">
                    <div class="social-area">
                        <a href="#" aria-label="Facebook"><i class="lab la-facebook-f"></i></a>
                        <a href="#" aria-label="YouTube"><i class="lab la-youtube"></i></a>
                        <a href="#" aria-label="Twitter"><i class="lab la-twitter"></i></a>
                    </div>
                    <div class="quick_link">
                        <ul>
                            <li><a href="{% url 'plast4ce:plast4ce_blog' %}">News</a></li>
                            <li><a href="{% url 'plast4ce:plast4ce_faq' %}">FAQ</a></li>
                            <li><a href="{% url 'plast4ce:plast4ce_pricing' %}">Pricing</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="header-area">
    <div class="sticky-area">
        <div class="navigation">
            <div class="container-fluid">
                <div class="header-inner-box">
                    <div class="logo">
                        <a class="navbar-brand" href="{% url 'plast4ce:plast4ce_home' %}">
                            <img src="{% static 'plast4ce/img/logo.png' %}" alt="{{ site_name }}">
                        </a>
                    </div>
                    <div class="main-menu">
                        <nav class="navbar navbar-expand-lg">
                            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                                aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                                <span class="navbar-toggler-icon"></span>
                                <span class="navbar-toggler-icon"></span>
                            </button>
                            <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                                <ul class="navbar-nav m-auto">
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'home' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_home' %}">Home</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'about' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_about' %}">About</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'services' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_services' %}">Services</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'projects' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_projects' %}">Projects</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'blog' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_blog' %}">Blog</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'team' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_team' %}">Team</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'shop' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_shop' %}">Shop</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'faq' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_faq' %}">FAQ</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link {% if nav_section == 'contact' %}active{% endif %}" href="{% url 'plast4ce:plast4ce_contact' %}">Contact</a>
                                    </li>
                                </ul>
                            </div>
                        </nav>
                    </div>
                    <div class="icon-wrapper">
                        <div class="search-icon search-trigger"><i class="las la-search"></i></div>
                        <div class="shopping-cart">
                            <a href="{% url 'plast4ce:plast4ce_cart' %}" class="text-dark"><i class="las la-shopping-cart"></i></a>
                        </div>
                    </div>
                    <div class="header-btn">
                        <a href="{% url 'plast4ce:plast4ce_contact' %}" class="main-btn primary">Get a quote</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="search-popup">
    <span class="search-back-drop"></span>
    <div class="search-inner">
        <div class="container">
            <div class="upper-text">
                <div class="text">Search</div>
                <button type="button" class="close-search"><span class="la la-times"></span></button>
            </div>
            <form method="get" action="{% url 'plast4ce:plast4ce_blog' %}">
                <div class="form-group">
                    <input type="search" name="q" value="" placeholder="Search..." aria-label="Search">
                    <button type="submit"><i class="la la-search"></i></button>
                </div>
            </form>
        </div>
    </div>
</div>
