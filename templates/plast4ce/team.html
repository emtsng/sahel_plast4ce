{% extends "plast4ce/site_base.html" %}
{% load static %}
{% block title %}Team — {{ site_name }}{% endblock %}
{% block content %}
{% include 'partials/plast4ce/breadcrumb.html' %}
<div class="team-section section-padding pb-60">
    <div class="container">
        <div class="section-title text-center">
            <h6>People</h6>
            <h2>Our team</h2>
        </div>
        <div class="row justify-content-center">
            {% for m in team_members %}
            <div class="col-xl-4 col-lg-4 col-md-6 col-sm-6 wow fadeInUp">
                <div class="team-single">
                    <div class="team-img">
                        <img src="{% static m.image %}" alt="">
                        <ul class="list-unstyled team-social">
                            <li><a href="#" aria-label="Twitter"><i class="lab la-twitter"></i></a></li>
                            <li><a href="#" aria-label="Facebook"><i class="lab la-facebook"></i></a></li>
                            <li><a href="#" aria-label="Instagram"><i class="lab la-instagram"></i></a></li>
                        </ul>
                    </div>
                    <div class="team-content">
                        <h4 class="team-name"><a href="{% url 'plast4ce:plast4ce_team_detail' m.id %}">{{ m.name }}</a></h4>
                        <p class="team-title">{{ m.role }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
