{% extends "plast4ce/site_base.html" %}
{% load static %}
{% block title %}FAQ — {{ site_name }}{% endblock %}
{% block content %}
{% include 'partials/plast4ce/breadcrumb.html' %}
<div class="faq-section section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="section-title text-center">
                    <h2>Frequently asked questions</h2>
                </div>
                <div class="accordion" id="faqPlast4ce">
                    {% for item in faq_items %}
                    <div class="accordion-item">
                        <h3 class="accordion-header" id="h{{ forloop.counter }}">
                            <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#c{{ forloop.counter }}">{{ item.q }}</button>
                        </h3>
                        <div id="c{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#faqPlast4ce">
                            <div class="accordion-body">{{ item.a }}</div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
